<style>
    /* Desktop Hover Underline Effect */
    .nav-link { position: relative; padding: 5px 0; }
    .nav-link::after {
        content: ''; position: absolute; width: 0; height: 3px;
        bottom: -2px; left: 0; background-color: #c5a059; transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .nav-link:hover::after { width: 100%; }

    /* Mobile Link Styles */
    .mobile-link { color: white; transition: all 0.4s ease; padding: 10px 0; }
    .mobile-link:hover { color: #c5a059; transform: scale(1.15); letter-spacing: 2px; }
    
    /* Open State for JS */
    .menu-open { transform: translateY(0) !important; }
</style>

<script>
    const menuBtn = document.getElementById('menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    const menuIcon = document.getElementById('menu-icon');

    menuBtn.addEventListener('click', () => {
        const isOpen = mobileMenu.classList.toggle('menu-open');
        
        if (isOpen) {
            menuIcon.classList.replace('fa-bars-staggered', 'fa-xmark');
            document.body.style.overflow = 'hidden'; 
        } else {
            menuIcon.classList.replace('fa-xmark', 'fa-bars-staggered');
            document.body.style.overflow = 'auto';
        }
    });

    document.querySelectorAll('#mobile-menu a').forEach(link => {
        link.addEventListener('click', () => {
            mobileMenu.classList.remove('menu-open');
            menuIcon.classList.replace('fa-xmark', 'fa-bars-staggered');
            document.body.style.overflow = 'auto';
        });
    });
</script>
